# Route grouping. Distances are in units of the median hold size on the photo
# (sqrt of median hold mask area), so they don't depend on photo resolution or distance.
link_factor: 6.0        # two same-colour holds this close (mask gap) belong to one route
tape_reach_factor: 0.6  # a tape diamond this close to a hold marks it (start or finish)
min_route_holds: 3      # smaller same-colour clusters are reported as stray holds
# The highest taped hold is the finish (one diamond) when its centre sits in the top
# `finish_top_frac` of the route's height. Every other taped hold is a start (two
# diamonds at the bottom).
finish_top_frac: 0.5
