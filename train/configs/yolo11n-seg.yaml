# yolo11n-seg: CPU/Spaces default. 2.9M params.
name: yolo11n-seg
model: yolo11n-seg.pt
# Train on every dataset's train split; select the model and test on the last one
# (our own Basecamp walls).
datasets:
  - data/yolo/roboflow
  - data/yolo/basecamp
val_dataset: data/yolo/basecamp
epochs: 150
imgsz: 1024        # holds are small in phone photos of a whole wall
batch: 8           # fits a 12 GB GPU at 1024
patience: 30
seed: 0
augment:
  # colour-blind: any hold may take any hue/saturation during training
  hsv_h: 0.5
  hsv_s: 0.9
  hsv_v: 0.4
  degrees: 5.0
  fliplr: 0.5
  mosaic: 1.0
  scale: 0.5
