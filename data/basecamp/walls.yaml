# Basecamp Climbing walls. One entry per physical wall section; the id is the folder
# name under data/basecamp/raw/<id>/ (lowercase, a-z0-9-). Photos of one wall always
# land in one split (see data/split_by_wall.py).
#
# Example:
#   - id: cave-left
#     angle: overhang     # slab | vertical | overhang | roof
#     notes: "left half of the cave, under the skylight"
walls:
  - id: wall-01
    angle: vertical
    notes: "2 photos; the second also shows the neighbouring wall"
  - id: wall-02
    angle: vertical
    notes: "3 photos of adjacent sections whose routes cross between photos, so one id"
  - id: wall-03
    angle: vertical
    notes: "2 photos; one route appears in both"
  - id: wall-04
    angle: vertical
    notes: "1 photo"
