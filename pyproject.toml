[project]
name = "climb-beta"
version = "0.1.0"
description = "Phase 1 of a climbing beta app: colour-blind hold segmentation plus a separate hold-colour step, for one gym."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Detector, SAM pseudo-masks and the crop classifier. Heavy: never installed in CI.
ml = [
    "torch>=2.7",
    "torchvision>=0.22",
    "ultralytics>=8.3.40",
    "timm>=1.0",
]
# Roboflow dataset download.
data = ["roboflow>=1.1", "python-dotenv>=1.0", "huggingface_hub>=0.26"]
# Label Studio export decoding (brush RLE).
label = ["label-studio-sdk>=1.0"]
# Gradio demo.
app = ["gradio>=5.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/climb_beta"]

# RTX 50-series (Blackwell, sm_120) needs CUDA 12.8+ wheels. macOS falls back to PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude/skills", "graphify-out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
ignore_missing_imports = true
warn_unused_ignores = false

# Heavy optional deps are typed as Any, so mypy gives the same result with or
# without the extras installed (CI never installs them).
[[tool.mypy.overrides]]
module = [
    "ultralytics", "ultralytics.*", "timm", "timm.*", "torch", "torch.*",
    "torchvision", "torchvision.*", "gradio", "gradio.*", "roboflow", "roboflow.*",
    "huggingface_hub", "huggingface_hub.*", "label_studio_sdk", "label_studio_sdk.*",
    "dotenv",
]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not ml'"
markers = ["ml: needs the heavy `ml` extra (torch/ultralytics/timm); skipped in CI"]
